[project]
name = "hr-agent"
version = "0.1.0"
description = "Enterprise HR & IT Agentic Assistant based on Google ADK"
readme = "SDD.md"
requires-python = ">=3.11"
dependencies = [
    "google-adk>=0.1.0",
    "google-cloud-aiplatform>=1.60.0",
    "google-cloud-secret-manager>=2.20.0",
    "pydantic>=2.7.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "redis>=5.0.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.1",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
